device: cuda
seed: 3333

model:
  stu_model:
    name: ResNet34U_f
  tea_model:
    name: ResNet34U_f
    dav2_model_name: 'depth-anything/Depth-Anything-V2-Small-hf'
  num_channels_output: 1
data:
  root: ../polypdepth_dataset/
  dataset: kvasir_SEG
  data2_dir: TrainDataset
  require_depth: False
  image_dirname: images
  mask_dirname: masks
  depth_dirname: 
  json_filename: datalist_info/official/kvasir_SEG_CVC_ClinicDB_seed_42.json
  label_mode: percentage
  labeled_perc: 10
  labeled_bs: 2
  batch_size: 4
  shuffle: false
  num_workers: 0
  val_split_perc: 0
  test:
    resize_width: 320
    resize_height: 320
    dataset_root: /kaggle/input/datasets/tonhuynhchi/polyp-depth/TestDataset/Kvasir,/kaggle/input/datasets/tonhuynhchi/polyp-depth/TestDataset/ETIS-LaribPolypDB,/kaggle/input/datasets/tonhuynhchi/polyp-depth/TestDataset/CVC-ColonDB,/kaggle/input/datasets/tonhuynhchi/polyp-depth/TestDataset/CVC-ClinicDB,/kaggle/input/datasets/tonhuynhchi/polyp-depth/TestDataset/CVC-300
    dataset_name: Kvasir,ETIS-LaribPolypDB,CVC-ColonDB,CVC-ClinicDB,CVC-300
    batch_size: 1

nEpoch: 300

optimizer:
  lr: 0.01
  weight_decay: 0.0001
  momentum: 0.9

tea_optimizer:
  lr: 0.01
  weight_decay: 0.0001
  momentum: 0.9

scheduler:
  eta_min: 1.0e-5

Trainer:
  rampup_unit: 'iter' # either epoch or iter
  consistency_rampup: 5000
  ema_decay: 0.999
  consistency: 2.0
  teacher_reliable_threshold: 0.75
  student_reliable_threshold: 0.85
  depth_learn_from_stu_weight: 0.3
  # contrastive_weight: 1.0

Hook:
  MeanTeacherEvalHook:
    eval_every_epoch: 2
  ExtendMLFlowLoggerHook:
    should_use: True
    interactive_plot: True
    dagshub_repo_owner: 'AkiyaNguyen'
    dagshub_repo_name: 'polyp_segmentation'
    experiment_name: 'Ablation'
    dir_save_plot: 'plots'
    logging_fields:
      - '*loss*'
      - '*lr*'
      - '*weight*'
      - '*Dice*'
      - '*IoU*'
      - '*ACC_overall*'
    local_dir_save_ckpt: 'ckpt'
    dagshub_dir_save_ckpt: 'ckpt'
    max_save_epoch_interval: 50
    criteria: test_stu_Dice
    dagshub_destination_src_file: 'src_file'
    list_src_dir_files: ['utils', 'test', 'models', 'data', 'logs']
    dagshub_meta_dir: 'meta'
    run_name:
    meta_info:
      kaggle_run_link:
      dataset_link: https://www.kaggle.com/datasets/tonhuynhchi/polyp-depth
      description: 'Mean Teacher with TeaSameStu teacher training flow'

score_criteria: test_stu_Dice

hyperparameter_sweep:
  Trainer/contrastive_weight:
    method: suggest_categorical
    params:
      name: contrastive_weight
      choices:
        - 0.5
        - 1.0
        - 1.5
