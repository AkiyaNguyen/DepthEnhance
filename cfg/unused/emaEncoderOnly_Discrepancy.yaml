device: cuda
seed: 8888

model:
  stu_model:
    name: ResNet34U_f
  tea_model:
    name: DepthResidualSEFusion_ResNet34U_f_EMAEncoderOnly
  num_channels_output: 1
data:
  root: ../polypdepth_dataset/
  dataset: kvasir_SEG
  data2_dir: TrainDataset
  require_depth: true
  image_dirname: images
  mask_dirname: masks
  depth_dirname: depth_v2
  label_mode: percentage
  labeled_perc: 10
  labeled_bs: 2
  batch_size: 4
  shuffle: False
  num_workers: 0
  val_split_perc: 0
  test:
    resize_width: 320
    resize_height: 320
    dataset_root: ../polypdepth_dataset/TestDataset/Kvasir 
    image_dirname: images
    mask_dirname: masks
    depth_dirname: depth_v2
    batch_size: 1

nEpoch: 300

optimizer:
  lr: 0.01 #
  weight_decay: 0.0001 #
  momentum: 0.9

tea_optimizer:
  lr: 0.01 #
  weight_decay: 0.0001 #
  momentum: 0.9

scheduler:
  eta_min: 1.0e-5

Trainer:
  consistency_rampup_epochs: 100
  consistency: 2 #
  ema_decay: 0.999
  fea_discrepancy_weight: 0.15
  fea_discrepancy_rampup_epochs: 75.0
Hook:
  FrequentSaveModel:
    save_dir: save_dir/
    save_every_epoch: 5
    save_name: ema_encoder_only
  SmartSaveHook:
    save_dir: save_dir/
    max_save_epoch_interval: 50
    save_name: ema_encoder_only
    criteria: test_stu_Dice
  MeanTeacherEvalHook:
    eval_every_epoch: 2
  MLFlowLoggerHook:
    dagshub_token: 
    dagshub_repo_owner: 'AkiyaNguyen'
    dagshub_repo_name: 'polyp_segmentation'
    experiment_name: 'ema_encoder_only'
    dir_save_plot: 'plots'
    logging_fields:
    - '*loss*'
    - '*lr*'
    - '*weight*'
    - '*Dice*'
    - '*IoU*'
    - '*ACC_overall*'
  # StopTrainAtEpoch:
  #   stop_at_epoch: 1000

score_criteria: test_stu_Dice

# Sweep keys: use / between segments (Trainer/fea_discrepancy_weight -> Trainer.fea_discrepancy_weight).
hyperparameter_sweep:
  Trainer/fea_discrepancy_weight:
    method: suggest_float
    params:
      name: fea_discrepancy_weight
      low: 0.05
      high: 0.3
  Trainer/fea_discrepancy_rampup_epochs:
    method: suggest_float
    params:
      name: fea_discrepancy_rampup_epochs
      low: 12.0
      high: 32.0
    